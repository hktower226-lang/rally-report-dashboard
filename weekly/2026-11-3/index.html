<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192e4d"><title>2026년 11월 3주차 일정공지</title><style>
:root{--ink:#14233c;--blue:#2159b3;--bg:#f4f6fa;--line:#dbe4ef;--muted:#607189}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}button,a{font:inherit}button{cursor:pointer}a{color:#2058ac;text-decoration:none}
header{background:#192e4d;color:white;padding:21px 16px}header .inner,main{max-width:850px;margin:auto}h1{margin:0;font-size:clamp(22px,5vw,30px);letter-spacing:-.04em}header p{margin:4px 0 0;color:#ccdbf0;font-size:13px}
main{padding:17px 13px 30px}h2{font-size:16px;margin:0 0 8px}section{margin-bottom:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}.tabs button{min-width:max-content;flex:1;background:white;border:1px solid #cad6e6;border-radius:10px;color:#30435f;padding:10px;font-size:13px;font-weight:750;white-space:nowrap}.tabs button.active{background:var(--blue);border-color:var(--blue);color:white}
.panel{border:1px solid var(--line);border-radius:15px;background:white;padding:15px}.heading{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}.heading strong{font-size:19px}.heading span{font-size:12px;color:var(--muted)}.venue{padding:10px 0;border-bottom:1px solid #eef1f5}.venue:last-child{border-bottom:0}.venue strong{font-size:14px}.venue .time{color:#2058ac;margin-right:8px}.address{font-size:12px;color:var(--muted);margin-top:2px}.address a{color:#2058ac;text-decoration:underline;text-underline-offset:3px}
.label{font-size:12px;color:#5e718a;font-weight:850;margin:15px 0 7px}.persons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.person{min-width:0}.person>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:3px;background:#f6f8fc;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px;text-align:left;font-size:14px;font-weight:750}.person>button span:last-child{font-size:11px;color:#3466a7;white-space:nowrap}.person>button[aria-expanded=true]{background:#eaf2ff;border-color:#8dafe2;border-radius:10px 10px 0 0}
.ph{border:1px solid #8dafe2;border-top:0;border-radius:0 0 10px 10px;padding:9px 10px;font-size:13px;font-weight:750}.ph a{background:#2058ac;color:white;border-radius:6px;padding:4px 9px;margin-left:7px;font-size:12px;display:inline-block}.note{font-size:12px;color:#315886;background:#eef4ff;padding:10px;border-radius:8px;margin:11px 0 2px}.mini{font-size:11px;color:var(--muted);margin:9px 0 0}.footer{font-size:11px;text-align:center;color:#718197;margin:20px 0}button:focus-visible,a:focus-visible{outline:3px solid #e4ab38;outline-offset:2px}
@media(min-width:700px){header{padding:28px}main{padding:25px}.panel{padding:21px}.persons{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body>
<header><div class="inner"><h1>2026년 11월 3주차 일정공지</h1><p>11월 16일(월) ~ 20일(금) · 경기지역본부</p></div></header>
<main><section><h2>날짜 선택</h2><div id="dates" class="tabs"></div></section><section><h2>지역별 집회현황</h2><div id="regions" class="tabs"></div></section><div id="panel" class="panel"></div><div class="footer">한국타워크레인조종사노동조합 경기지역본부</div></main>
<script id="source" type="application/json">{"contacts":{"김시삼":"010-7556-6759","박규원":"010-3589-7970","김효진":"010-9023-9119","조광명":"010-3192-0754","남의송":"010-8631-5165","백시안":"010-2220-8877","김삼성":"010-3008-0357","최영식":"010-5367-1139","윤성우":"010-9277-5038","정민섭":"010-5441-4902","임한종":"010-8431-2468","배형만":"010-5258-6265","유명화":"010-4137-9398","조삼재":"010-6740-0308","김주찬":"010-3763-8574","박근성":"010-9243-9992","박춘성":"010-8284-7974","정윤기":"010-8615-9876","한세환":"010-6401-9317","엄기우":"010-8595-9715","김우선":"010-8922-7671","황창연":"010-3305-2521","이동준":"010-5318-8683","김정섭":"010-8986-2014","정승일":"010-3092-1508"},"places":[{"id":"kyerHQ","name":"계룡건설 본사","address":"대전광역시 서구 문정로48번길 48","detail":"정문 앞 인도 30m","registered":"2026-10-31 ~ 2026-11-20","agency":"대전둔산경찰서","doc":"제26-1811833-000370호","note":"신고서에는 탄방동 본사로 기재"},{"id":"kyer1","name":"계룡건설 확대1","address":"대전광역시 서구 청사서로 11","detail":"무지개아파트 후문 좌우측 인도","registered":"2026-11-16 ~ 2026-12-10","agency":"대전둔산경찰서","doc":"제26-1811833-000394호"},{"id":"kyer2","name":"계룡건설 확대2","address":"대전광역시 유성구 도룡동 383-24","detail":"인근 인도 약 50m, 신고 지도상 우측","registered":"2026-11-13 ~ 2026-12-10","agency":"대전유성경찰서","doc":"제26-1811833-000453호"},{"id":"daewooHQ","name":"대우건설 본사","address":"서울특별시 중구 을지로 170","detail":"본사 앞 인도 및 하위 1개 차로","registered":"2026-10-22 ~ 2026-11-19","agency":"서울중부경찰서","doc":"제26-1810001-000561호"},{"id":"daewoo1","name":"대우건설 확대1","address":"서울특별시 용산구 이촌로88길 15","detail":"왕궁아파트 정문 앞 인도 및 하위 1개 차로","registered":"2026-11-14 ~ 2026-12-11","agency":"서울용산경찰서","doc":"제26-1810001-002801호"},{"id":"ssangHQ","name":"쌍용건설 본사","address":"서울특별시 송파구 올림픽로 299","detail":"본사 앞 인도","registered":"2026-10-23 ~ 2026-11-18","agency":"서울송파경찰서","doc":"제26-1810001-000936호","note":"쌍용건설 공식 홈페이지 본사 주소와 대조 완료"},{"id":"ssangSeah","name":"글로벌세아·쌍용건설 관련 신고장소","address":"서울특별시 강남구 영동대로 429","detail":"세아빌딩 앞, 월요일 지정 집결지는 아님","registered":"2026-11-13 ~ 2026-12-11","agency":"서울수서경찰서","doc":"제26-1810001-000840호","extra":true},{"id":"dongbuHQ","name":"동부건설 본사","address":"서울특별시 강남구 테헤란로 137","detail":"코레이트타워 앞 인도, 별도 배치시간 미지정","registered":"2026-10-22 ~ 2026-11-19","agency":"서울강남경찰서","doc":"제26-1810001-000999호","extra":true}],"regions":[{"id":"south","name":"남부지부","role":"계룡건설 집회 · 주관","chief":"김우선","deputy":"엄기우","primary":["김시삼","박규원"],"reserve":["김효진","조광명"],"target":"계룡건설","special":"계룡 확대1·2 및 본사 순차 진행","locations":["kyer1","kyer2","kyerHQ"]},{"id":"southwest","name":"남서지부","role":"계룡건설 집회 · 지원","chief":"황창연","deputy":"한세환","primary":["남의송","백시안"],"reserve":["김삼성","최영식"],"target":"계룡건설","special":"남부지부와 합동 집회","locations":["kyer1","kyer2","kyerHQ"]},{"id":"west","name":"서부·북서지부","role":"대우건설 집회 · 주관","chief":"이동준","chief2":"김정섭","deputy":"정윤기","primary":["윤성우","정민섭"],"reserve":["임한종","배형만"],"target":"대우건설","special":"11/16(월) 예비 2명까지 전원 출동, 총 4명","locations":["daewooHQ","daewoo1","dongbuHQ"]},{"id":"east","name":"동부지부","role":"대우·쌍용 집회 · 지원","chief":"정승일","deputy":"박춘성","primary":["유명화","조삼재"],"reserve":["김주찬","박근성"],"target":"대우건설 / 쌍용건설","special":"11/16(월) 쌍용건설 본사 직접 집결","locations":["ssangHQ","daewooHQ","ssangSeah","dongbuHQ"]}]}</script><script>(()=>{
const d=JSON.parse(document.getElementById("source").textContent);
const days={16:"월",17:"화",18:"수",19:"목",20:"금"};
const $=x=>document.getElementById(x);
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const locations=Object.fromEntries(d.places.map(x=>[x.id,x]));
let day=16,branch="west";
function venue(id,time,title){
const p=locations[id]; const u="https://map.naver.com/p/search/"+encodeURIComponent(p.address+" "+p.name);
return '<div class="venue"><strong><span class="time">'+time+'</span>'+safe(title||p.name)+'</strong><div class="address">주소: <a href="'+safe(u)+'" target="_blank" rel="noopener">'+safe(p.address)+'</a></div></div>';
}
function member(n){
const phone=d.contacts[n]||"";
return '<div class="person"><button class="toggle" type="button" aria-expanded="false"><span>'+safe(n)+'</span><span>연락처 ▾</span></button><div class="ph" hidden>'+(phone?safe(phone)+'<a href="tel:'+phone.replace(/\D/g,"")+'">전화</a>':"번호 확인 필요")+'</div></div>';
}
function group(names,name){return '<div class="label">'+safe(name)+'</div><div class="persons">'+names.map(member).join("")+'</div>';}
function render(){
$("dates").innerHTML=Object.entries(days).map(([n,w])=>'<button type="button" data-day="'+n+'" class="'+(+n===day?"active":"")+'">'+n+'일 ('+w+')</button>').join("");
$("regions").innerHTML=d.regions.map(r=>'<button type="button" data-branch="'+r.id+'" class="'+(r.id===branch?"active":"")+'">'+safe(r.name)+'</button>').join("");
const r=d.regions.find(x=>x.id===branch),mon=day===16;
let loc="",note="";
if(branch==="south"||branch==="southwest"){
loc=venue("kyer1","07~09시","계룡 확대1")+venue("kyer2","07~09시","계룡 확대2")+venue("kyerHQ","09~14시","계룡건설 본사");
}else if(branch==="west"){
loc=mon?venue("daewooHQ","08~14시","대우건설 본사 · 4명 전원 집결"):venue("daewoo1","07~09시","대우 확대1")+venue("daewooHQ","09~14시","대우건설 본사");
}else{
loc=mon?venue("ssangHQ","08~14시","쌍용건설 본사 직접 집결"):venue("daewooHQ","08~14시","대우건설 본사 직접 집결");
}
if(mon&&branch==="west")note="월요일 서부·북서: 지정 2명 + 예비 2명, 총 4명 전원 참석";
else if(mon&&branch==="east")note="월요일 동부: 쌍용건설 본사 08:00 집결 · 서울본부 지원 합류";
else if(mon)note="월요일은 해당 지부장이 필수 선봉입니다";
$("panel").innerHTML='<div class="heading"><strong>'+safe(r.name)+'</strong><span>11월 '+day+'일 ('+days[day]+')</span></div>'+loc+(note?'<div class="note">'+safe(note)+'</div>':"")+group(r.primary,"지정인원")+group(r.reserve,mon&&branch==="west"?"월요일 전원 참석 (평시 예비)":"예비인원")+group([r.chief,...(r.chief2?[r.chief2]:[])],"지부장 · 월요일 필수 선봉")+group([r.deputy],"대행 간부 · 연락책임")+'<p class="mini">참여자 이름을 누르면 전화번호가 표시됩니다. 지정인원 결원 시 예비인원 대체, 변경 시 지부 책임자에게 사전 공유.</p>';
}
document.addEventListener("click",ev=>{
const dt=ev.target.closest("[data-day]"),br=ev.target.closest("[data-branch]"),bt=ev.target.closest(".toggle");
if(dt){day=+dt.dataset.day;render();return}
if(br){branch=br.dataset.branch;render();return}
if(bt){let exp=bt.getAttribute("aria-expanded")==="true";bt.setAttribute("aria-expanded",String(!exp));bt.nextElementSibling.hidden=exp;bt.lastElementChild.textContent=exp?"연락처 ▾":"접기 ▴"}
});
render();
})();</script></body></html>
